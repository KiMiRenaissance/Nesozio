<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <title>Pencarian Produk - NesoZio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand animate__animated animate__fadeInLeft" href="../index.html"><img src="../assets/logo.webp" width="120px" /> </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="./index.html">Produk</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html#kategori">Kategori</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../setting/index.html">Bantuan</a>
                    </li>
                </ul>
                <div class="search-wrapper me-lg-3 mb-2 mb-lg-0">
                    <input class="form-control me-2 search-input" id="mainSearchInput" type="search" placeholder="Cari produk sekolah, elektronik..." aria-label="Search"/>
                </div>
                <div class="nav-icons">
                    <button class="nav-icon-btn" style="background:var(--primary);color:white;" title="Cari">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <button class="nav-icon-btn" onclick="window.location.href='../cart/index.html'" title="Keranjang">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-badge" style="display:none;">0</span>
                    </button>
                    <div class="profile-btn-wrapper"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4 px-lg-4">
        <div class="section-header">
            <div>
                <h2 class="section-title" id="searchTitle">Semua Produk</h2>
                <p style="color:var(--text-muted);margin:0.5rem 0 0;" id="resultCount"></p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <select id="sortSelect" class="sort-select" onchange="SearchPage.sort()">
                    <option value="default">Urutkan</option>
                    <option value="price-low">Harga: Rendah ke Tinggi</option>
                    <option value="price-high">Harga: Tinggi ke Rendah</option>
                </select>
            </div>
        </div>
        
        <div class="category-filters" id="categoryFilters">
            <button class="category-btn active" data-category="all" onclick="SearchPage.filterCat('all', this)">Semua</button>
            <button class="category-btn" data-category="Alat Tulis" onclick="SearchPage.filterCat('Alat Tulis', this)">Alat Tulis</button>
            <button class="category-btn" data-category="Tas" onclick="SearchPage.filterCat('Tas', this)">Tas</button>
            <button class="category-btn" data-category="Sepatu" onclick="SearchPage.filterCat('Sepatu', this)">Sepatu</button>
            <button class="category-btn" data-category="Aksesoris" onclick="SearchPage.filterCat('Aksesoris', this)">Aksesoris</button>
			<button class="category-btn" data-category="Buku" onclick="SearchPage.filterCat('Buku', this)">Buku</button>
        </div>

        <div class="row" id="product-container"></div>
    </div>

    <footer class="footer">
        <div class="container px-lg-4">
            <div class="footer-bottom" style="border:none;margin:0;padding:0;text-align:center;">
                © 2026 NesoZio. Semua hak dilindungi.
            </div>
        </div>
    </footer>
    
    <script src="../js/products.js"></script>
    <script src="../js/db-bridge.js"></script>
    <script src="../js/navbar-product.js"></script>
    <script src="../js/search-page.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
