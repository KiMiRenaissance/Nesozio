<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <title>Checkout - NesoZio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand animate__animated animate__fadeInLeft" href="../index.html">Neso<span>Zio</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../search/index.html">Produk</a></li>
                    <li class="nav-item"><a class="nav-link" href="../index.html#kategori">Kategori</a></li>
                    <li class="nav-item"><a class="nav-link" href="../setting/index.html">Bantuan</a></li>
                </ul>
                <div class="search-wrapper me-lg-3 mb-2 mb-lg-0">
                    <input class="form-control search-input" type="search" placeholder="Cari produk..." aria-label="Search"/>
                </div>
                <div class="nav-icons">
                    <button class="nav-icon-btn" onclick="window.location.href='../cart/index.html'" title="Keranjang" style="background:var(--primary);color:white;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-badge" style="display:none;">0</span>
                    </button>
                    <div class="profile-btn-wrapper"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container cart-page px-lg-4">
        <div class="cart-header">
            <div>
                <h1 style="font-size:clamp(1.5rem,3vw,2rem);font-weight:700;margin:0;">💳 Checkout Pesanan</h1>
                <p style="color:var(--text-muted);margin:0.25rem 0 0;">Lengkapi data diri untuk melanjutkan pembayaran</p>
            </div>
            <a href="../cart/index.html" class="btn-detail" style="text-decoration:none;display:inline-flex;align-items:center;gap:0.5rem;padding:0.6rem 1.25rem;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Kembali
            </a>
        </div>

        <div class="row" id="checkoutContent"></div>
    </div>

    <footer class="footer">
        <div class="container px-lg-4">
            <div class="footer-bottom" style="border:none;margin:0;padding:0;text-align:center;">
                © 2026 NesoZio. Semua hak dilindungi.
            </div>
        </div>
    </footer>
    
    <script src="../js/products.js"></script>
    <script src="../js/db-bridge.js"></script>
    <script src="../js/navbar-product.js"></script>
    <script src="../js/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
